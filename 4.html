<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>接口聚合页</title>
<style>
    :root {
        --primary: #1e88e5;
        --bg: #f5f7fa;
        --card: #fff;
        --text: #0b1e33;
        --muted: #8b9eb0;
        --border: #eef2f7;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0; padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background: var(--bg); color: var(--text);
        font-size: 14px;
    }
    .container { max-width: 820px; margin: 0 auto; padding: 12px; width: 100%; }
    .main-card {
        background: var(--card); border-radius: 16px; padding: 12px 14px;
        box-shadow: 0 4px 16px rgba(0,0,0,0.04); margin-bottom: 12px;
    }
    
    /* 导航与搜索 */
    .nav-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    .nav-tab {
        padding: 8px 18px; border-radius: 999px; border: 1px solid var(--primary);
        background: #fff; color: var(--primary); cursor: pointer; font-size: 0.95rem;
    }
    .nav-tab.active { background: var(--primary); color: #fff; }
    .search-box {
        width: 100%; padding: 10px 14px 10px 38px; border-radius: 999px;
        border: 1px solid var(--border); background: #f8fafc; margin-bottom: 12px;
        font-size: 0.95rem; outline: none; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='%238b9eb0' viewBox='0 0 16 16'><path d='M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z'/></svg>");
        background-repeat: no-repeat; background-position: 14px center;
    }
    .toggle-btn {
        position: fixed; bottom: 20px; right: 20px; z-index: 99;
        width: 56px; height: 56px; border-radius: 50%; background: var(--primary);
        color: #fff; border: none; cursor: pointer; font-size: 0.8rem;
        box-shadow: 0 4px 12px rgba(30,136,229,0.4); line-height: 1.2;
    }

    /* 通用面板 */
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    .loading, .error-msg { padding: 20px; text-align: center; color: var(--muted); }
    .error-msg { color: #d32f2f; }

    /* ====== 点播页 (参考基准，自带 flex-wrap 兜底) ====== */
    .entry { margin-bottom: 12px; padding: 12px; border-radius: 12px; border: 1px solid var(--border); background: #fff; }
    .entry-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .entry-name { font-weight: 600; font-size: 1.05rem; }
    .entry-meta-inline { font-size: 0.75rem; color: var(--muted); }
    .badge-new { color: #43a047; } .badge-old { color: var(--muted); }
    .url-line {
        display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
        padding: 6px 10px; background: #f8fafc; border-radius: 999px;
        flex-wrap: wrap; /* 点播页核心：换行兜底 */
        width: 100%; box-sizing: border-box; /* 新增双保险 */
    }
    .url-tag { background: #eef2f7; padding: 2px 8px; border-radius: 999px; font-size: 0.75rem; flex-shrink: 0; }
    .url-text { flex: 1 1 0; min-width: 40px; font-size: 0.85rem; word-break: break-all; }
    .copy-btn {
        flex-shrink: 0; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--primary);
        background: #fff; color: var(--primary); cursor: pointer; font-size: 0.75rem;
    }

    /* ====== 直播页 (本次重点修复：复刻点播适配) ====== */
    .live-entry { margin-bottom: 14px; padding: 12px; border-radius: 12px; border: 1px solid var(--border); background: #fff; }
    .live-entry-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .live-entry-name { font-weight: 600; font-size: 1.05rem; }
    .live-entry-meta { font-size: 0.75rem; }
    .live-badge-new { color: #43a047; } .live-badge-old { color: var(--muted); }
    .live-info-inline { font-size: 0.75rem; color: var(--muted); margin-bottom: 4px; }
    .live-info-inline .sep { margin: 0 6px; }
    
    /* 修复核心：复刻点播宽度约束 + 强制收缩 */
    .live-url-line {
        position: relative; padding: 8px 12px 8px 10px; margin-bottom: 6px;
        background: #f8fafc; border-radius: 40px; border: 1px solid #eef2f7;
        display: flex; flex-direction: column; gap: 4px;
        width: 100%; box-sizing: border-box; /* 复刻点播：显式100%约束 */
        overflow: hidden; /* 兜底防溢出 */
    }
    .live-url-body {
        display: flex; align-items: flex-start; gap: 6px 10px;
        width: 100%; min-width: 0; /* 允许子项收缩 */
    }
    .live-url-tag { background: #eef2f7; padding: 2px 8px; border-radius: 999px; font-size: 0.75rem; flex-shrink: 0; white-space: nowrap; }
    .live-url-text { flex: 1 1 0; min-width: 40px; font-size: 0.85rem; word-break: break-all; color: var(--primary); }
    .live-urls { margin-top: 6px; }

    /* 顶部聚合蓝块 */
    .live-hero {
        background: linear-gradient(135deg, #1e88e5, #42a5f5); color: #fff;
        border-radius: 16px; padding: 16px; margin-bottom: 16px;
    }
    .live-hero-title { font-size: 1.2rem; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .live-hero-url { background: rgba(255,255,255,0.15); padding: 10px 14px; border-radius: 999px; display: flex; align-items: center; gap: 10px; }
    .live-hero-url-text { flex: 1; word-break: break-all; font-size: 0.95rem; }
    .live-hero .copy-btn { background: rgba(255,255,255,0.2); color: #fff; border-color: rgba(255,255,255,0.4); }

    /* 小屏媒体查询：彻底对齐点播换行机制 */
    @media (max-width: 600px) {
        .container { padding: 8px; }
        .nav-tab { padding: 6px 14px; font-size: 0.85rem; }
        /* 点播页小屏 */
        .url-line { flex-wrap: wrap; }
        /* 直播页小屏：允许body换行，防止长URL硬撑 */
        .live-url-body { flex-wrap: wrap; gap: 4px; }
        .live-url-text { width: 100%; max-width: calc(100% - 56px); }
        .live-hero-url { flex-wrap: wrap; }
    }

    /* 简洁模式 */
    .simple-mode .nav-tabs, .simple-mode .download-panel, .simple-mode .about-panel { display: none; }
    .full-mode .search-box { margin-top: 8px; }
</style>
</head>
<body class="full-mode">
<div class="container">
    <div class="main-card" id="mainCard">
        <div class="nav-tabs" id="navTabs"></div>
        <input type="text" class="search-box" id="searchBox" placeholder="搜索...">
        
        <div class="tab-panel active" id="api-panel">
            <div class="loading" id="apiLoading">⏳ 正在加载点播接口...</div>
            <div id="listContainer"></div>
        </div>

        <div class="tab-panel" id="live-panel">
            <div class="loading" id="liveLoading">⏳ 正在加载直播列表...</div>
            <div id="liveListContainer"></div>
        </div>

        <div class="tab-panel download-panel" id="download-panel">
            <div id="downloads-content"></div>
        </div>

        <div class="tab-panel about-panel" id="about-panel">
            <div style="padding:20px;color:#8b9eb0;">关于页面</div>
        </div>
    </div>
</div>

<button class="toggle-btn" id="toggleBtn">切换<br>简洁版</button>

<script>
const MODE_KEY = 'site_mode_v1';
let currentMode = localStorage.getItem(MODE_KEY) || 'full';
let currentTabId = 'api';
let topSeed = Date.now() + Math.random();

// 模拟配置（实际环境请保留你的原配置）
const API_DOMAINS = [{tag: '备份一线', base: 'https://0.12yue.de5.net/tvbox/'}, {tag: '备份二线', base: 'https://0.cdz.qzz.io/tvbox/'}];
const LIVE_DOMAINS = [{tag: '备份一线', base: 'https://0.12yue.de5.net/tvbox/live/'}, {tag: '备份二线', base: 'https://0.cdz.qzz.io/tvbox/live/'}];
const DOWNLOAD_SOURCES = [];

const navTabs = document.getElementById('navTabs');
const searchBox = document.getElementById('searchBox');
const btn = document.getElementById('toggleBtn');
const mainCard = document.getElementById('mainCard');

document.body.className = currentMode + '-mode';

// 工具函数
function formatDate(d) { return d ? `${d.slice(0,4)}年${d.slice(4,6)}月${d.slice(6,8)}日` : ''; }
function isRecent(d) { if(!d||d.length!==8)return false; const y=parseInt(d.slice(0,4)),m=parseInt(d.slice(4,6))-1,day=parseInt(d.slice(6,8)); return (Date.now()-new Date(y,m,day).getTime())/86400000<=2; }
function scrollToTopEntry() { window.scrollTo({top: 0, behavior: 'smooth'}); }

function bindCopy(container) {
    if(!container) return;
    container.querySelectorAll('.copy-btn').forEach(b => {
        b.onclick = () => {
            const url = b.getAttribute('data-url');
            navigator.clipboard.writeText(url).then(() => {
                b.innerText = '已复制'; setTimeout(() => b.innerText = '复制', 1500);
            });
        };
    });
}

// 点播渲染 (保留原逻辑)
function renderApi() {
    const container = document.getElementById('listContainer');
    const loading = document.getElementById('apiLoading');
    if(loading) loading.style.display = 'block';
    // 模拟加载（实际请保留你的 fetchListText）
    setTimeout(() => {
        if(loading) loading.style.display = 'none';
        container.innerHTML = `<div class="entry"><div class="entry-header"><div class="entry-name">点播测试</div><div class="entry-meta-inline"><span class="badge-new">备份时间 ${formatDate('20260913')}</span></div></div><div class="entry-urls"><div class="url-line"><span class="url-tag">原始线路</span><span class="url-text">http://example.com/api.json</span><button class="copy-btn" data-url="http://example.com/api.json">复制</button></div></div></div>`;
        bindCopy(container);
    }, 300);
}

// 直播渲染 (保留原逻辑 + 适配后CSS生效)
function renderLiveList() {
    const container = document.getElementById('liveListContainer');
    const loading = document.getElementById('liveLoading');
    if(loading) loading.style.display = 'block';
    
    // 模拟结构（实际请保留你的 fetchLiveText + parseLiveItems）
    setTimeout(() => {
        if(loading) loading.style.display = 'none';
        let html = `<div class="live-hero"><div class="live-hero-title">📡 海量直播聚合多线路专用接口</div><div class="live-hero-url"><span class="live-hero-url-text">https://0.12yue.de5.net/tvbox/海量直播线路.json</span><button class="copy-btn" data-url="https://0.12yue.de5.net/tvbox/海量直播线路.json">复制</button></div></div>`;
        
        html += `<div class="live-entry"><div class="live-entry-header"><div class="live-entry-name">综合直播</div><div class="live-entry-meta"><span class="live-badge-new">2026年09月13日</span>&nbsp;&nbsp;41</div></div><div class="live-urls"><div class="live-url-line"><div class="live-info-inline">来源：王二小二线 | UA：bingcha/1.1</div><div class="live-url-body"><span class="live-url-tag">原始线路</span><span class="live-url-text">http://193.123.86.190:14888/TV/iptv.php</span><button class="copy-btn" data-url="http://193.123.86.190:14888/TV/iptv.php">复制</button></div></div><div class="live-url-line"><div class="live-url-body"><span class="live-url-tag">备份一线</span><span class="live-url-text">https://0.12yue.de5.net/tvbox/live/综合直播.php</span><button class="copy-btn" data-url="https://0.12yue.de5.net/tvbox/live/综合直播.php">复制</button></div></div></div>`;
        
        html += `<div class="live-entry"><div class="live-entry-header"><div class="live-entry-name">Kimentanm1线</div><div class="live-entry-meta"><span class="live-badge-new">2026年09月13日</span>&nbsp;&nbsp;21</div></div><div class="live-urls"><div class="live-url-line"><div class="live-info-inline">来源：王二小线 | UA：null</div><div class="live-url-body"><span class="live-url-tag">原始线路</span><span class="live-url-text">https://ghfast.top/https://raw.githubusercontent.com/Kimentanm/aptv/master/m3u/iptv.m3u</span><button class="copy-btn" data-url="https://ghfast.top/https://raw.githubusercontent.com/Kimentanm/aptv/master/m3u/iptv.m3u">复制</button></div></div></div>`;
        
        container.innerHTML = html;
        bindCopy(container);
    }, 300);
}

function renderDownloads() { const c=document.getElementById('downloads-content'); if(c)c.innerHTML='<div class="loading">下载页</div>'; }
function renderAbout() { bindCopy(document.getElementById('about-panel')); }

const tabsData = [{id:"api",label:"点播",hideSearch:false},{id:"live",label:"直播",hideSearch:false},{id:"download",label:"下载",hideSearch:false},{id:"about",label:"关于",hideSearch:true}];

function renderTabs() {
    navTabs.innerHTML = tabsData.map(t => `<button class="nav-tab ${t.id === currentTabId ? 'active' : ''}" data-tab="${t.id}">${t.label}</button>`).join('');
    navTabs.querySelectorAll('.nav-tab').forEach(tab => {
        tab.addEventListener('click', function() {
            navTabs.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            this.classList.add('active');
            currentTabId = this.getAttribute('data-tab');
            showPanel(currentTabId);
        });
    });
}

function showPanel(tabId) {
    // 强制同步导航高亮
    navTabs.querySelectorAll('.nav-tab').forEach(t => t.classList.toggle('active', t.getAttribute('data-tab') === tabId));
    if(tabId === 'api') renderApi();
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    const panel = document.getElementById(tabId + '-panel');
    if(panel) panel.classList.add('active');
    if(tabId === 'live') renderLiveList();
    if(tabId === 'download') renderDownloads();
    if(tabId === 'about') renderAbout();
    const targetTab = tabsData.find(t => t.id === tabId);
    if(searchBox) searchBox.style.display = (targetTab && targetTab.hideSearch) ? 'none' : '';
}

// 搜索
searchBox.addEventListener('input', () => {
    const kw = searchBox.value.toLowerCase().trim();
    document.querySelectorAll('#api-panel .entry').forEach(e => e.classList.toggle('hidden', !e.getAttribute('data-name').includes(kw)));
    document.querySelectorAll('#live-panel .live-entry').forEach(e => e.classList.toggle('hidden', !e.getAttribute('data-name').includes(kw)));
});

// 切换模式 (旧版逻辑：每次切换刷新点播+导航匹配)
function positionSearchBox() {
    if(currentMode === 'simple') { if(searchBox.parentNode !== mainCard.parentNode) mainCard.parentNode.insertBefore(searchBox, mainCard); }
    else { if(searchBox.parentNode !== mainCard) navTabs.insertAdjacentElement('afterend', searchBox); }
}
function updateBtnText() { btn.innerHTML = currentMode === 'simple' ? '切换<br>全能版' : '切换<br>简洁版'; }

btn.addEventListener('click', () => {
    topSeed = Date.now() + Math.random();
    currentMode = (currentMode === 'simple') ? 'full' : 'simple';
    localStorage.setItem(MODE_KEY, currentMode);
    document.body.className = currentMode + '-mode';
    updateBtnText();
    positionSearchBox();
    
    if(currentMode !== 'simple') {
        renderTabs();
        showPanel(currentTabId);
        if(currentTabId === 'api') { renderApi(); scrollToTopEntry(); }
    } else {
        currentTabId = 'api';
        showPanel('api');
        renderApi();
        scrollToTopEntry();
    }
});

// 初始化
positionSearchBox();
updateBtnText();
renderTabs();
showPanel('api');
renderApi();
</script>
</body>
</html>
